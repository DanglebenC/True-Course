<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TrueCourse — Settings</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; max-width: 480px; margin: 32px auto; color: #1c1c1c; }
  h1 { font-size: 18px; }
  p { font-size: 13px; line-height: 1.5; color: #4b4f57; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 16px 0 6px; }
  input[type="password"], input[type="text"] { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #c7cbe0; border-radius: 6px; }
  button { margin-top: 12px; padding: 9px 16px; font-size: 13px; font-weight: 600; background: #1d2b64; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #142050; }
  .status { font-size: 12px; margin-top: 10px; color: #166a3e; }
  a { color: #1d2b64; }
</style>
</head>
<body>
  <h1>TrueCourse — Settings</h1>
  <p>
    This extension calls the Claude API directly from your browser using your own API key.
    Your key is stored locally on this device (<code>chrome.storage.local</code>) and is never sent anywhere except
    Anthropic's API. Get a key at
    <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a>.
  </p>

  <label for="api-key">Claude API key</label>
  <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off" />

  <button id="save">Save</button>
  <p id="status" class="status"></p>

  <script src="options.js"></script>
</body>
</html>
